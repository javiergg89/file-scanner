name: CI

# Builds and runs the checks once per pull request to main (Dependabot's too): on open, reopen or ready for review.
# Later commits to the same PR do not rerun it; run it by hand from Actions (workflow_dispatch) before merging.
# Pushes to main do not run it: release.yml runs the checks when the version goes up.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

# A rerun for the same PR cancels the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # A PR opened as a draft waits for "Ready for review".
    if: github.event.pull_request.draft != true
    runs-on: windows-latest
    steps:
      # Actions pinned by SHA: a tag can move, a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # CI=true turns on RestoreLockedMode (Directory.Build.props): restore fails if packages.lock.json does not match.
      - name: Compilar
        run: dotnet build FileScanner.slnx -c Release

      - name: Probar
        run: dotnet run -c Release --no-build --project FileScanner.Check
